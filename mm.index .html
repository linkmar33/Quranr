<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>اللعبة - أنا مين؟</title>
  <style>
    body {font-family: Tahoma, sans-serif; direction: rtl; text-align: center; background: #f0f8ff; padding: 20px;}
    .question {margin: 20px; padding: 20px; border: 1px solid #ccc; border-radius: 15px; background: #fff;}
    button {margin: 5px; padding: 10px 20px; border: none; border-radius: 10px; background: #4CAF50; color: white; cursor: pointer;}
    button:hover {background: #45a049;}
    #result {font-size: 20px; margin-top: 20px; font-weight: bold;}
    .message {font-size: 18px; color: #d2691e; margin-top: 15px;}
  </style>
</head>
<body>

  <h2>🎯 لعبة: <input type="text" id="gameName" placeholder="أنا مين؟"></h2>
  <div id="quiz"></div>
  <div id="result"></div>
  <div id="message" class="message"></div>

  <script>
    const questions = [
      { q: "ما عاصمة مصر؟", options: ["القاهرة", "الإسكندرية", "أسوان", "الجيزة"], answer: "القاهرة" },
      { q: "كم عدد الكواكب في المجموعة الشمسية؟", options: ["7", "8", "9", "10"], answer: "8" },
      { q: "أطول نهر في العالم؟", options: ["النيل", "الأمازون", "الدانوب", "اليانغتسي"], answer: "النيل" },
      { q: "أين تقع الأهرامات؟", options: ["الجيزة", "الأقصر", "أسوان", "سيناء"], answer: "الجيزة" },
      { q: "ما لغة القرآن الكريم؟", options: ["العربية", "الإنجليزية", "الفرنسية", "التركية"], answer: "العربية" },
      { q: "ما الكوكب الأحمر؟", options: ["الأرض", "المريخ", "المشتري", "عطارد"], answer: "المريخ" },
      { q: "كم عدد أيام السنة الميلادية؟", options: ["364", "365", "366", "367"], answer: "365" },
      { q: "ما عاصمة فرنسا؟", options: ["برلين", "مدريد", "باريس", "روما"], answer: "باريس" },
      { q: "أكبر قارة في العالم؟", options: ["أفريقيا", "آسيا", "أوروبا", "أمريكا"], answer: "آسيا" },
      { q: "أصغر كوكب في المجموعة الشمسية؟", options: ["المريخ", "عطارد", "الأرض", "نبتون"], answer: "عطارد" }
    ];

    const messages = {
      2: "كملي يا ياسو هانت اهي ✨",
      4: "شغلي مخك عشان تعرفي انا مين 🧠",
      6: "قربتي توصلي يا بطلة 💪",
      8: "تركزي شوية وهتكسبي 🏆",
      10: "يلا يا ياسو الجاي أحلى 🌸"
    };

    let currentQuestion = 0;
    let score = 0;

    function showQuestion() {
      if (currentQuestion < questions.length) {
        let q = questions[currentQuestion];
        let html = `<div class='question'><h3>${q.q}</h3>`;
        q.options.forEach(opt => {
          html += `<button onclick="checkAnswer('${opt}')">${opt}</button>`;
        });
        html += "</div>";
        document.getElementById("quiz").innerHTML = html;
        document.getElementById("message").innerHTML = "";
      } else {
        document.getElementById("quiz").innerHTML = "";
        document.getElementById("result").innerText = `خلصتي اللعبة 👏 عدد الإجابات الصحيحة: ${score} من ${questions.length}`;
      }
    }

    function checkAnswer(answer) {
      if (answer === questions[currentQuestion].answer) {
        score++;
      }
      currentQuestion++;
      if (messages[currentQuestion]) {
        document.getElementById("message").innerText = messages[currentQuestion];
      }
      showQuestion();
    }

    showQuestion();
  </script>
</body>
</html>
